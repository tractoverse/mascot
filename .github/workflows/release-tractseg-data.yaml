on:
  workflow_dispatch:

name: Release TractSeg Data

# The Zenodo archive URL is defined once here and inherited by all jobs.
env:
  ZENODO_URL: "https://zenodo.org/record/1477956/files/HCP105_Zenodo_NewTrkFormat.zip?download=1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 – parse the remote ZIP central directory (no download needed)
  # ---------------------------------------------------------------------------
  build-index:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - name: Parse ZIP central directory
        # zip_index.py uses only the Python standard library – no pip install needed.
        # It issues two HTTP range requests (tail + central directory) and writes
        # a JSON index mapping each bundle name to its per-subject file entries
        # (local header offset + compressed size + compression method).
        run: python3 data-raw/zip_index.py "$ZENODO_URL" zip-index.json

      - name: Upload index as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: zip-index
          path: zip-index.json
          retention-days: 1

      - name: Set matrix
        id: set-matrix
        run: |
          python3 - <<'EOF'
          import json, os
          with open("zip-index.json") as fh:
              index = json.load(fh)
          bundles = sorted(index.keys())
          matrix = {"include": [{"bundle": b} for b in bundles]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix) + "\n")
          print(f"Matrix set: {len(bundles)} bundles")
          EOF

  # ---------------------------------------------------------------------------
  # Job 2 – one runner per bundle (up to 72 parallel jobs)
  # ---------------------------------------------------------------------------
  process-bundle:
    needs: build-index
    runs-on: ubuntu-latest

    timeout-minutes: 120

    strategy:
      matrix: ${{ fromJSON(needs.build-index.outputs.matrix) }}
      fail-fast: false    # let other bundles finish even if one fails
      max-parallel: 5     # cap concurrent Zenodo connections; avoids 429 rate-limit errors

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download ZIP index artifact
        uses: actions/download-artifact@v4
        with:
          name: zip-index

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Cache the R package library so repeated re-runs and the 72 parallel
      # runners share a warm cache (keyed by the lock file / R version).
      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-tractseg-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-tractseg-${{ runner.os }}-

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Install R dependencies
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pkg_install(c("fs", "cli", "tractoverse/riot", "tractoverse/fiber"))
        shell: Rscript {0}

      # fetch_bundle.py uses only the Python standard library.
      # It issues one HTTP range request per TRK file (local header + payload)
      # and writes decompressed .trk files to TRACTSEG_TRK_DIR.
      - name: Fetch TRK files for bundle "${{ matrix.bundle }}"
        run: |
          python3 data-raw/fetch_bundle.py \
            "$ZENODO_URL" \
            zip-index.json \
            "${{ matrix.bundle }}" \
            "${{ runner.temp }}/trk/${{ matrix.bundle }}" \
            2

      - name: Convert TRK → RDS
        env:
          TRACTSEG_BUNDLE:  ${{ matrix.bundle }}
          TRACTSEG_TRK_DIR: ${{ runner.temp }}/trk/${{ matrix.bundle }}
          TRACTSEG_OUT_DIR: ${{ runner.temp }}/rds/${{ matrix.bundle }}
        run: Rscript data-raw/tractseg.R

      # Free up disk space before uploading (TRK files no longer needed).
      - name: Remove TRK files
        run: rm -rf "${{ runner.temp }}/trk"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE:   ${{ matrix.bundle }}
          RDS_DIR:  ${{ runner.temp }}/rds/${{ matrix.bundle }}
        run: |
          tag="tractseg-${BUNDLE}"
          mapfile -t files < <(ls "$RDS_DIR"/*.rds)
          n_files=${#files[@]}
          echo "Uploading ${n_files} RDS files to release ${tag} …"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            notes="$(printf \
              '## Overview\n\nPer-subject TractSeg bundle for **%s** from %s HCP subjects.\nEach `.rds` file stores a `fiber::bundle` object readable with `readRDS()`.\n\n> [!NOTE]\n> This is a **data release** and does not correspond to any version of the `mascot` R package.\n\n## License\n\nThis data is redistributed under the **CC BY-NC 4.0** license consistent with the original dataset.\n**Non-commercial use only.** See <https://creativecommons.org/licenses/by-nc/4.0/>.\n\n## Attribution\n\nPlease cite the original TractSeg publication when using or redistributing this data:\n\n> Wasserthal J, Neher P, Maier-Hein KH. TractSeg -- Fast and accurate white matter tract segmentation. *NeuroImage* **183**, 239–253 (2018). <https://doi.org/10.1016/j.neuroimage.2018.07.070>\n\nRaw data archived at Zenodo: <https://zenodo.org/records/1477956> (DOI: 10.5281/zenodo.1477956)\n\n## HCP Data Terms\n\nThe source tractograms are derived from the **Human Connectome Project Young Adult** dataset.\nUsers must comply with the applicable [HCP data-use terms](https://www.humanconnectome.org/study/hcp-young-adult/document/wu-minn-hcp-consortium-open-access-data-use-terms) and acknowledgment requirements.\n\n## Modifications\n\nThe original `.trk` streamline files (TRK format) from the Zenodo archive have been:\n\n- Converted to R `fiber::bundle` objects and serialised as `.rds` files using the [`mascot`](https://tractoverse.github.io/mascot/) R package.\n- Subsetted to one bundle per release tag; no spatial or statistical modifications were made to the streamline data.\n\n## Disclaimer\n\nThis redistribution is provided for non-commercial research purposes only.\nIt does not imply endorsement by the original authors, DKFZ, Zenodo, HCP, or any affiliated institution.' \
              "$BUNDLE" "$n_files")"

            gh release create "$tag" \
              --title "TractSeg – ${BUNDLE}" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              "${files[@]}"
          fi
